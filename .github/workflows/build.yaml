name: Build libmpv-android

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      dv_release:
        description: 'Publish only the dv variant as this release tag (e.g. v1.1.7-dv.6); empty builds every variant into the vnext draft'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Bundle (default)
        if: inputs.dv_release == ''
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_default.sh
          ./bundle_default.sh
      - name: Bundle (full)
        if: inputs.dv_release == ''
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_full.sh
          ./bundle_full.sh
      # encoders-gpl, zanzibarr'ın ihtiyacı yok (uygulama yalnız dv varyantını
      # kullanıyor); fftools_ffi'nin FFmpeg 7.1 uyumu ayrıca değerlendirilecek.
      # - name: Bundle (encoders-gpl)
      #   working-directory: ./buildscripts
      #   run: |
      #     sudo chmod +x bundle_encoders-gpl.sh
      #     ./bundle_encoders-gpl.sh
      - name: Bundle (dv)
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_dv.sh
          ./bundle_dv.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            ./buildscripts/*.jar
            ./buildscripts/artifacts/**
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main' && inputs.dv_release == ''
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            buildscripts/*.zip
            buildscripts/artifacts/**
      # usetopia: vendor/media_kit_libs_android_video downloads
      # releases/download/<tag>/dv-<abi>.jar.
      - name: Upload DV release
        uses: softprops/action-gh-release@v1
        if: inputs.dv_release != ''
        with:
          draft: false
          prerelease: false
          tag_name: ${{ inputs.dv_release }}
          name: ${{ inputs.dv_release }}
          target_commitish: ${{ github.sha }}
          files: buildscripts/artifacts/dv/*.jar
